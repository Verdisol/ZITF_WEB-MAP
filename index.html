<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZITF Interactive Exhibition Guide</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; font-family: 'Segoe UI', sans-serif; }

    /* LOGIN OVERLAY – full background image */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: url('zitf.jpg') center/cover no-repeat;
      display: flex; align-items: center; justify-content: center;
      z-index: 10000;
    }
    #login-box {
      background: rgba(255,255,255,0.9);
      padding: 2.5rem; border-radius: 12px;
      text-align: center; max-width: 360px; width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    #login-box h2 { margin-bottom: 1.5rem; color: #1a4b2e; }
    #login-box input {
      width: 100%; padding: 12px; margin-bottom: 15px;
      border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;
    }
    #login-box button {
      width: 100%; padding: 12px; background: #1a4b2e;
      color: white; border: none; border-radius: 6px; font-size: 1rem;
      font-weight: bold; cursor: pointer;
    }
    #login-box button:hover { background: #2d6a4a; }
    .login-error { color: #c0392b; margin-top: 10px; display: none; }

    /* MAIN APP */
    #app { height: 100%; display: none; flex-direction: column; }
    #map { flex: 1; }

    /* TOOLBAR */
    #toolbar {
      background: white; padding: 10px 15px; display: flex;
      flex-wrap: wrap; align-items: center; gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 1000;
    }
    #search-box { flex: 1; min-width: 200px; position: relative; }
    #search-box input {
      width: 100%; padding: 8px 12px; border: 1px solid #ccc;
      border-radius: 20px; font-size: 0.95rem;
    }
    #search-results {
      position: absolute; top: 100%; left: 0; right: 0;
      background: white; border: 1px solid #ddd; max-height: 200px;
      overflow-y: auto; display: none; z-index: 2000;
      border-radius: 0 0 8px 8px;
    }
    .search-item {
      padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #eee;
    }
    .search-item:hover { background: #f0f0f0; }

    .tool-btn {
      padding: 8px 15px; background: #1a4b2e; color: white;
      border: none; border-radius: 20px; font-size: 0.9rem;
      font-weight: 500; cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 5px;
    }
    .tool-btn:hover { background: #2d6a4a; }
    .tool-btn.active { background: #e67e22; }
    .basemap-btn { background: #444; }
    .basemap-btn.active { background: #e67e22; }

    .distance-popup {
      background: rgba(0,0,0,0.8); color: white; padding: 4px 10px;
      border-radius: 12px; font-size: 0.85rem; white-space: nowrap;
    }

    .pulse {
      width: 20px; height: 20px; background: #4285F4;
      border-radius: 50%; border: 3px solid white;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
      animation: pulse-ring 1.5s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(66,133,244,0.5); }
      70% { box-shadow: 0 0 0 12px rgba(66,133,244,0); }
      100% { box-shadow: 0 0 0 0 rgba(66,133,244,0); }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-overlay">
    <div id="login-box">
      <h2>🔐 ZITF Exhibition Map</h2>
      <input type="text" id="username" placeholder="Username" autocomplete="off">
      <input type="password" id="password" placeholder="Password">
      <button id="login-btn">Sign In</button>
      <p class="login-error" id="login-error">Invalid credentials. Please try again.</p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <div id="toolbar">
      <div id="search-box">
        <input type="text" id="search-input" placeholder="🔍 Search any stand, hall, bank...">
        <div id="search-results"></div>
      </div>
      <button class="tool-btn basemap-btn" id="btn-streets">🗺️ OSM Streets</button>
      <button class="tool-btn basemap-btn active" id="btn-satellite">🛰️ Satellite</button>
      <button class="tool-btn" id="btn-measure">📏 Measure</button>
      <button class="tool-btn" id="btn-gps">📍 GPS</button>
    </div>
    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============== 1. LOGIN ==============
    const loginOverlay = document.getElementById('login-overlay');
    const appDiv = document.getElementById('app');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');

    const VALID_USER = 'admin';
    const VALID_PASS = 'zitf2026';

    loginBtn.addEventListener('click', () => {
      if (usernameInput.value === VALID_USER && passwordInput.value === VALID_PASS) {
        loginOverlay.style.display = 'none';
        appDiv.style.display = 'flex';
        initMap();
      } else {
        loginError.style.display = 'block';
        passwordInput.value = '';
      }
    });
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    // ============== 2. MAP SETUP ==============
    let map, streetsLayer, satelliteLayer;
    let allFeatures = [];
    let layersGroup;

    // List of your layer files (exact filenames) in the layers/ folder
    const layerFiles = [
      "BANKING & FINANCE",
      "ZITF BOUNDARY",
      "CAR DEALERSHIPS",
      "CITY COUNCILS & MUNICIPALITIES",
      "EMBASSIES",
      "ENERGY & PETROLEUM SECTOR",
      "ENVIRONMENT",
      "FARMING & AGRICULTURE",
      "FOOD COURTS RESTAURANTS",
      "FOOD PRODUCTION SECTOR",
      "GATES",
      "GOVERNMENT DEPTS & MINISTRIES",
      "GROUNDS",
      "GYM & SPORTING",
      "HALLS",
      "HEALTH SECTOR",
      "LIFE ASSURANCE POLICY PROVIDERS",
      "LIVESTOCK EXHIBIT AREA",
      "LIVESTOCK EXHIBIT",
      "MINING & EARTH MOVING",
      "NATIONAL SECURITY FORCES",
      "OTHER",
      "TOILETS",
      "TRANSPORT & TRAVELLING",
      "REGULATORY SECTOR",
      "ROADS",
      "STAFF QUARTERS",
      "TELECOMS & MOBILE NETWORK PROVIDERS",
      "TOILETSS"   // remove if you don't have this file
    ];

    // Custom styles for each layer – adjust colors and emoji as you like
    function getLayerStyle(layerName) {
      const styles = {
        "BANKING & FINANCE": { color: "#1a4b2e", icon: "🏦" },
        "ZITF BOUNDARY": { color: "#000000", weight: 3, fillOpacity: 0, dashArray: "10,5" },
        "CAR DEALERSHIPS": { color: "#e67e22", icon: "🚗" },
        "CITY COUNCILS & MUNICIPALITIES": { color: "#2c3e50", icon: "🏛️" },
        "EMBASSIES": { color: "#8e44ad", icon: "🏳️" },
        "ENERGY & PETROLEUM SECTOR": { color: "#f1c40f", icon: "⚡" },
        "ENVIRONMENT": { color: "#27ae60", icon: "🌳" },
        "FARMING & AGRICULTURE": { color: "#6ab04c", icon: "🌾" },
        "FOOD COURTS RESTAURANTS": { color: "#e74c3c", icon: "🍽️" },
        "FOOD PRODUCTION SECTOR": { color: "#d35400", icon: "🏭" },
        "GATES": { color: "#e67e22", icon: "🚪" },
        "GOVERNMENT DEPTS & MINISTRIES": { color: "#34495e", icon: "🏢" },
        "GROUNDS": { color: "#16a085", icon: "🏟️" },
        "GYM & SPORTING": { color: "#e84393", icon: "🏋️" },
        "HALLS": { color: "#8e44ad", icon: "🏛️" },
        "HEALTH SECTOR": { color: "#c0392b", icon: "🏥" },
        "LIFE ASSURANCE POLICY PROVIDERS": { color: "#2980b9", icon: "🛡️" },
        "LIVESTOCK EXHIBIT AREA": { color: "#a0522d", icon: "🐄" },
        "LIVESTOCK EXHIBIT": { color: "#a0522d", icon: "🐑" },
        "MINING & EARTH MOVING": { color: "#7f8c8d", icon: "⛏️" },
        "NATIONAL SECURITY FORCES": { color: "#2c3e50", icon: "🛡️" },
        "OTHER": { color: "#7f8c8d", icon: "📌" },
        "TOILETS": { color: "#3498db", icon: "🚻" },
        "TRANSPORT & TRAVELLING": { color: "#e67e22", icon: "🚌" },
        "REGULATORY SECTOR": { color: "#16a085", icon: "⚖️" },
        "ROADS": { color: "#555555", weight: 2, dashArray: "5,5" },
        "STAFF QUARTERS": { color: "#f39c12", icon: "🏠" },
        "TELECOMS & MOBILE NETWORK PROVIDERS": { color: "#9b59b6", icon: "📡" },
        "TOILETSS": { color: "#3498db", icon: "🚻" }  // if you have this duplicate
      };
      return styles[layerName] || { color: "#1a4b2e", icon: "📍" }; // default fallback
    }

    async function initMap() {
      map = L.map('map', { zoomControl: true }).setView([-20.158, 28.533], 17);

      // Basemaps
      streetsLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 19
      });
      satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri, Maxar, Earthstar', maxZoom: 19
      });
      satelliteLayer.addTo(map); // default Satellite

      layersGroup = L.featureGroup().addTo(map);

      // Load GeoJSON layers
      await loadAllLayers();

      // ========== BASEMAP TOGGLE ==========
      document.getElementById('btn-streets').addEventListener('click', () => {
        if (map.hasLayer(satelliteLayer)) map.removeLayer(satelliteLayer);
        if (!map.hasLayer(streetsLayer)) streetsLayer.addTo(map);
        document.getElementById('btn-streets').classList.add('active');
        document.getElementById('btn-satellite').classList.remove('active');
      });
      document.getElementById('btn-satellite').addEventListener('click', () => {
        if (map.hasLayer(streetsLayer)) map.removeLayer(streetsLayer);
        if (!map.hasLayer(satelliteLayer)) satelliteLayer.addTo(map);
        document.getElementById('btn-satellite').classList.add('active');
        document.getElementById('btn-streets').classList.remove('active');
      });

      // ========== SEARCH ==========
      initSearch();

      // ========== MEASUREMENT TOOL ==========
      let measureActive = false, measurePoints = [], measurePolyline = null, measureMarkers = [];

      function clearMeasurement() {
        if (measurePolyline) map.removeLayer(measurePolyline);
        measureMarkers.forEach(m => map.removeLayer(m));
        measurePoints = []; measureMarkers = []; measurePolyline = null;
      }

      function updateMeasurementDisplay() {
        if (measurePolyline) map.removeLayer(measurePolyline);
        if (measurePoints.length > 1) {
          measurePolyline = L.polyline(measurePoints, { color: '#e67e22', weight: 3, dashArray: '5, 5' }).addTo(map);
          let totalDist = 0;
          for (let i = 1; i < measurePoints.length; i++) {
            totalDist += map.distance(measurePoints[i - 1], measurePoints[i]);
          }
          const lastMarker = measureMarkers[measureMarkers.length - 1];
          if (lastMarker) {
            lastMarker.unbindTooltip();
            lastMarker.bindTooltip(`${totalDist.toFixed(0)} m`, { permanent: true, className: 'distance-popup', direction: 'top' }).openTooltip();
          }
        }
      }

      document.getElementById('btn-measure').addEventListener('click', function() {
        measureActive = !measureActive;
        this.classList.toggle('active', measureActive);
        if (!measureActive) {
          clearMeasurement();
          map.off('click', onMeasureClick);
          return;
        }
        map.on('click', onMeasureClick);
        // Turn off GPS if active
        if (gpsWatcher) stopGPSTracking();
      });

      function onMeasureClick(e) {
        measurePoints.push(e.latlng);
        const marker = L.circleMarker(e.latlng, {
          radius: 6, color: '#e67e22', fillColor: '#fff', fillOpacity: 1, weight: 2
        }).addTo(map);
        measureMarkers.push(marker);
        updateMeasurementDisplay();
      }

      // ========== GPS TRACKING ==========
      let gpsWatcher = null, gpsMarker = null;

      function startGPSTracking() {
        if (!navigator.geolocation) { alert("Geolocation not supported."); return; }
        if (gpsMarker) map.removeLayer(gpsMarker);
        gpsWatcher = navigator.geolocation.watchPosition(
          (pos) => {
            const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
            if (!gpsMarker) {
              const icon = L.divIcon({ className: 'pulse', iconSize: [20, 20] });
              gpsMarker = L.marker(latlng, { icon }).addTo(map);
            } else {
              gpsMarker.setLatLng(latlng);
            }
            map.setView(latlng, 18, { animate: true });
          },
          (err) => { alert("Location error: " + err.message); stopGPSTracking(); },
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
      }

      function stopGPSTracking() {
        if (gpsWatcher) { navigator.geolocation.clearWatch(gpsWatcher); gpsWatcher = null; }
        if (gpsMarker) { map.removeLayer(gpsMarker); gpsMarker = null; }
      }

      document.getElementById('btn-gps').addEventListener('click', function() {
        const isActive = this.classList.toggle('active');
        if (isActive) {
          if (measureActive) { clearMeasurement(); measureActive = false; document.getElementById('btn-measure').classList.remove('active'); map.off('click', onMeasureClick); }
          startGPSTracking();
        } else {
          stopGPSTracking();
        }
      });
    }

    // ========== LOAD GEOJSON LAYERS ==========
    async function loadAllLayers() {
      for (const layerName of layerFiles) {
        const url = `layers/${encodeURIComponent(layerName)}.geojson`;
        try {
          const response = await fetch(url);
          if (!response.ok) {
            console.warn(`Could not load ${url} (status ${response.status})`);
            continue;
          }
          const geojson = await response.json();
          const style = getLayerStyle(layerName);

          const layer = L.geoJSON(geojson, {
            style: function(feature) {
              // Apply style to polygons and lines
              if (feature.geometry.type.includes('LineString') || feature.geometry.type.includes('MultiLineString')) {
                return { color: style.color, weight: style.weight || 2, dashArray: style.dashArray || null };
              }
              return { color: style.color, weight: style.weight || 2, fillOpacity: style.fillOpacity !== undefined ? style.fillOpacity : 0.2 };
            },
            pointToLayer: function(feature, latlng) {
              // Use emoji as marker
              const iconHtml = `<div style="font-size: 24px; line-height: 24px; text-align: center;">${style.icon || '📍'}</div>`;
              const icon = L.divIcon({
                html: iconHtml,
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15],
                className: ''
              });
              return L.marker(latlng, { icon });
            },
            onEachFeature: function(feature, layer) {
              const props = feature.properties;
              const name = props.name || props.Name || props.NAME || 'Unnamed';
              layer.bindPopup(`<strong>${name}</strong><br>Layer: ${layerName}`);
              // Attach layer name for search
              feature._layerName = layerName;
            }
          }).addTo(layersGroup);

          // Collect features for search
          layer.eachLayer(function(l) {
            if (l.feature) {
              allFeatures.push({ feature: l.feature, layer: l });
            }
          });
        } catch (err) {
          console.error(`Error loading ${layerName}:`, err);
        }
      }
      console.log(`Loaded ${allFeatures.length} features from the provided layers.`);
    }

    // ========== DYNAMIC SEARCH ==========
    function initSearch() {
      const searchInput = document.getElementById('search-input');
      const searchResults = document.getElementById('search-results');

      searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim().toLowerCase();
        searchResults.innerHTML = '';
        if (query.length === 0) {
          searchResults.style.display = 'none';
          return;
        }
        const matches = allFeatures.filter(item => {
          const props = item.feature.properties;
          const name = (props.name || props.Name || props.NAME || '').toLowerCase();
          const category = item.feature._layerName.toLowerCase();
          return name.includes(query) || category.includes(query);
        });
        if (matches.length === 0) {
          searchResults.style.display = 'none';
          return;
        }
        matches.slice(0, 10).forEach(match => {
          const div = document.createElement('div');
          div.className = 'search-item';
          const name = match.feature.properties.name || match.feature.properties.Name || match.feature.properties.NAME || 'Unnamed';
          div.textContent = `${name} (${match.feature._layerName})`;
          div.addEventListener('click', () => {
            // Zoom to feature
            const geom = match.feature.geometry;
            if (geom.type === 'Point') {
              map.setView([geom.coordinates[1], geom.coordinates[0]], 20);
            } else {
              try {
                map.fitBounds(match.layer.getBounds());
              } catch (e) {
                const temp = L.geoJSON(match.feature);
                map.fitBounds(temp.getBounds());
              }
            }
            searchInput.value = name;
            searchResults.style.display = 'none';
          });
          searchResults.appendChild(div);
        });
        searchResults.style.display = 'block';
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#search-box')) searchResults.style.display = 'none';
      });
    }

    // Distance helper (Haversine)
    L.Map.prototype.distance = function(latlng1, latlng2) {
      const R = 6371000;
      const dLat = (latlng2.lat - latlng1.lat) * Math.PI / 180;
      const dLon = (latlng2.lng - latlng1.lng) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(latlng1.lat*Math.PI/180) * Math.cos(latlng2.lat*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    };
  </script>
</body>
</html>
