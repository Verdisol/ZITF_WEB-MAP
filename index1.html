<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ZITF Live Map – Navigation + Search Bar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; height: 100vh; background: #1e3a2f; }
        
        /* ----- LOGIN PAGE WITH zitf.jpg (unchanged) ----- */
        .login-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('zitf.jpg') center/cover no-repeat;   /* STILL zitf.jpg */
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
            backdrop-filter: brightness(0.7);
        }
        .login-card {
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            border-radius: 40px; padding: 40px 35px;
            width: 90%; max-width: 450px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid #ffd966;
            color: white;
        }
        .login-card h1 { font-size: 2rem; color: #ffd966; margin-bottom: 15px; }
        .welcome-text { font-size: 1.2rem; font-weight: bold; color: #ffaa33; }
        .safety-text { font-size: 1rem; color: #ccffcc; margin-bottom: 25px; font-style: italic; }
        .login-card input { width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 60px; background: #fff; font-size: 1rem; }
        .login-card button { background: #ffaa33; color: #1e3a2f; border: none; padding: 14px; width: 100%; border-radius: 60px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .demo-note { margin-top: 15px; font-size: 0.8rem; color: #ccc; }
        
        /* ----- MAP UI (unchanged) ----- */
        .map-container { display: none; flex-direction: column; height: 100vh; }
        .top-bar { background: #0f2b1a; color: white; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 15px; z-index: 1001; }
        .top-bar h1 { font-size: 1.3rem; margin-right: auto; }
        .gps-indicator { background: #2b5a36; padding: 6px 14px; border-radius: 40px; font-size: 0.8rem; }
        
        .nav-panel {
            position: absolute; top: 80px; left: 10px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            padding: 15px; border-radius: 20px; width: 280px;
            z-index: 1000; color: white; border-left: 4px solid #00ff88;
        }
        .nav-panel h3 { margin-bottom: 10px; color: #88ffaa; }
        .nav-panel input { width: 100%; padding: 10px; border-radius: 30px; border: none; margin: 8px 0; }
        .nav-panel button { width: 100%; background: #00cc66; border: none; padding: 10px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .directions-card {
            position: absolute; bottom: 20px; right: 20px; width: 310px; max-height: 360px;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); border-radius: 20px; padding: 12px;
            color: #f0f0f0; font-size: 13px; z-index: 1000; border-left: 5px solid #00ff88;
            overflow-y: auto; display: none;
        }
        .directions-card h4 { display: flex; justify-content: space-between; color: #88ffaa; }
        .close-dir { background: #aa3333; padding: 2px 10px; border-radius: 30px; cursor: pointer; }
        .step { padding: 8px 0; border-bottom: 1px solid #444; display: flex; gap: 8px; }
        
        @keyframes neonPulse {
            0% { filter: drop-shadow(0 0 0px #00ff66); }
            50% { filter: drop-shadow(0 0 12px #00ff88) drop-shadow(0 0 6px #00ff44); }
            100% { filter: drop-shadow(0 0 0px #00ff66); }
        }
        .blinking-icon { animation: neonPulse 0.9s infinite ease-in-out; }
        .leaflet-marker-icon { transition: transform 0.2s, filter 0.2s; cursor: pointer; }
        .leaflet-marker-icon:hover { transform: scale(1.25) translateY(-5px); filter: drop-shadow(0 0 16px #00ffaa) !important; z-index: 10000; }
        .route-line { stroke: #2a7fff; stroke-width: 5; stroke-dasharray: 8 4; }
        #map { flex: 1; width: 100%; background: #cfe3cf; }
    </style>
</head>
<body>

<div id="loginContainer" class="login-container">
    <div class="login-card">
        <h1>🏟️ ZITF</h1>
        <div class="welcome-text">🇿🇼 WELCOME TO ZITF</div>
        <div class="safety-text">PLEASE ENJOY YOUR VISIT AND STAY SAFE</div>
        <div style="font-weight:bold; margin:15px 0 5px;">ENTER YOUR DETAILS TO LOG IN</div>
        <input type="text" id="loginUsername" placeholder="Email" value="visitor@zitf.com">
        <input type="password" id="loginPassword" placeholder="Password" value="zitf@2026">
        <button id="loginBtn">🔓 ACCESS MAP</button>
        <div class="demo-note">✨ Use: visitor@zitf.com / zitf@2026</div>
    </div>
</div>

<div id="mapContainer" class="map-container">
    <div class="top-bar">
        <h1>📍 ZITF NAVIGATION LIVE MAP</h1>
        <div class="gps-indicator" id="gpsStatus"><span>🛰️</span> <span id="gpsText">Getting location...</span></div>
    </div>
    <div id="map"></div>
    <div id="navPanel" class="nav-panel">
        <h3>🧭 NAVIGATION OPTION</h3>
        <input type="text" id="navSearchInput" placeholder="Search destination (bank, atm, food...)" value="bank">
        <button id="navGoBtn">🔍 GET DIRECTIONS</button>
        <div class="dest-suggest">e.g., bank, atm, food, info</div>
    </div>
    <div id="directionsPanel" class="directions-card">
        <h4>🚶 TURN-BY-TURN <span class="close-dir" id="closeDirBtn">✖ CLOSE</span></h4>
        <div id="stepsContainer" class="step-list"></div>
    </div>
</div>

<script>
    document.getElementById('loginBtn').addEventListener('click', function() {
        const user = document.getElementById('loginUsername').value.trim();
        const pwd = document.getElementById('loginPassword').value.trim();
        if (user === "visitor@zitf.com" && pwd === "zitf@2026") {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('mapContainer').style.display = 'flex';
            initMap();
        } else {
            alert("Invalid credentials. Use visitor@zitf.com / zitf@2026");
        }
    });

    function initMap() {
        const roadLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' });
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri' });
        const map = L.map('map', { layers: [roadLayer] }).setView([-20.1325, 28.6272], 17);
        L.control.layers({ "🗺️ Roads": roadLayer, "🛰️ Satellite": satelliteLayer }, null, { position: 'topright' }).addTo(map);
        
        // ZITF boundary
        const zitfBoundary = { "type": "FeatureCollection", "features": [{ "type": "Feature", "properties": { "name": "ZITF Grounds" }, "geometry": { "type": "Polygon", "coordinates": [[[-20.1400,28.6200],[-20.1250,28.6200],[-20.1250,28.6350],[-20.1400,28.6350],[-20.1400,28.6200]]] } }] };
        L.geoJSON(zitfBoundary, { style: { color: "#ff6600", weight: 3, fillOpacity: 0.1, fillColor: "#ffaa44" } }).addTo(map);
        
        // Roads with QGIS style (only change from previous version)
        const roadsGeoJSON = { "type": "FeatureCollection", "features": [
            { "type": "Feature", "properties": { "name": "Main Avenue" }, "geometry": { "type": "LineString", "coordinates": [[28.6240,-20.1350],[28.6280,-20.1320],[28.6305,-20.1305]] } },
            { "type": "Feature", "properties": { "name": "Exhibition Road" }, "geometry": { "type": "LineString", "coordinates": [[28.6255,-20.1330],[28.6275,-20.1310],[28.6290,-20.1290]] } },
            { "type": "Feature", "properties": { "name": "Service Lane" }, "geometry": { "type": "LineString", "coordinates": [[28.6260,-20.1360],[28.6280,-20.1345],[28.6300,-20.1320]] } }
        ] };
        L.geoJSON(roadsGeoJSON, { style: { color: "#db1e2a", weight: 2.5, opacity: 1, lineCap: 'round', lineJoin: 'round', dashArray: "4, 12" } }).addTo(map);
        
        // Venues (banks, etc.)
        const venues = [
            { name: "EcoBank – Main Branch", type: "bank", lat: -20.1350, lng: 28.6242, icon: "🏦" },
            { name: "Stanbic Bank ATM Zone", type: "bank", lat: -20.1305, lng: 28.6295, icon: "🏧" },
            { name: "CBZ Banking Pavilion", type: "bank", lat: -20.1328, lng: 28.6269, icon: "🏦" },
            { name: "First Capital Bank", type: "bank", lat: -20.1378, lng: 28.6305, icon: "🏦" },
            { name: "Nedbank Mobile Unit", type: "bank", lat: -20.1345, lng: 28.6251, icon: "🏦" },
            { name: "ATM Court (FBC)", type: "bank", lat: -20.1318, lng: 28.6281, icon: "🏧" },
            { name: "Food Court & Cafés", type: "food", lat: -20.1312, lng: 28.6258, icon: "🍔" },
            { name: "Information Kiosk", type: "info", lat: -20.1335, lng: 28.6278, icon: "ℹ️" },
            { name: "ZITF Security Post", type: "service", lat: -20.1362, lng: 28.6225, icon: "👮" }
        ];
        const markersArray = [];
        function createCustomIcon(emoji) {
            return L.divIcon({ html: `<div style="background: white; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid #00cc66; box-shadow: 0 2px 6px black; background: radial-gradient(circle, #ffffff, #f0fdf4);">${emoji}</div>`, iconSize: [38,38], popupAnchor: [0,-18] });
        }
        venues.forEach(poi => {
            const marker = L.marker([poi.lat, poi.lng], { icon: createCustomIcon(poi.icon), title: poi.name }).bindPopup(`<b>${poi.name}</b><br>📌 ${poi.type.toUpperCase()}`).addTo(map);
            marker.poiData = poi;
            markersArray.push(marker);
            marker.on('add', function() {
                const el = marker._icon;
                if (el) {
                    el.classList.add('blinking-icon');
                    el.addEventListener('mouseenter', () => {
                        if (!marker._liveTip) { marker.bindTooltip('🔴 LIVE', { direction: 'top', offset: [0,-22] }).openTooltip(); marker._liveTip = true; setTimeout(() => marker.closeTooltip(), 700); }
                        else { marker.openTooltip(); setTimeout(() => marker.closeTooltip(), 600); }
                    });
                }
            });
            if (marker._icon) marker._icon.classList.add('blinking-icon');
        });
        
        // GPS & routing (unchanged)
        let currentPosition = null, userMarker = null, currentRoute = null, destMarker = null;
        function getCurrentPosition() { return new Promise((resolve, reject) => { if (!navigator.geolocation) reject("Not supported"); navigator.geolocation.getCurrentPosition(pos => resolve([pos.coords.latitude, pos.coords.longitude]), err => reject(err.message), { enableHighAccuracy: true }); }); }
        async function updateGPSIndicator() { try { const pos = await getCurrentPosition(); currentPosition = pos; document.getElementById('gpsText').innerHTML = `📍 ${pos[0].toFixed(5)}, ${pos[1].toFixed(5)}`; document.getElementById('gpsStatus').style.background = "#1e7e44"; if (userMarker) map.removeLayer(userMarker); userMarker = L.marker(pos, { icon: L.divIcon({ html: '📍', iconSize: [22,22] }) }).addTo(map).bindPopup("You are here").openPopup(); map.setView(pos, 18); return pos; } catch(err) { document.getElementById('gpsText').innerHTML = `⚠️ ${err.slice(0,30)}`; document.getElementById('gpsStatus').style.background = "#aa5533"; return null; } }
        async function fetchRoute(start, end) { const url = `https://router.project-osrm.org/route/v1/foot/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson&steps=true`; const resp = await fetch(url); const data = await resp.json(); if (data.code !== 'Ok') throw new Error("No route"); return data.routes[0]; }
        function drawBlueRoute(geojson) { if (currentRoute) map.removeLayer(currentRoute); currentRoute = L.geoJSON(geojson, { style: { color: "#2a7fff", weight: 6, opacity: 0.95, className: 'route-line' } }).addTo(map); map.fitBounds(currentRoute.getBounds()); }
        function renderSteps(routeObj) { const panel = document.getElementById('directionsPanel'); const container = document.getElementById('stepsContainer'); panel.style.display = 'block'; container.innerHTML = ''; let totalDist = 0; if (!routeObj.legs) return; routeObj.legs.forEach(leg => { totalDist += leg.distance; (leg.steps || []).forEach((step, idx) => { let instr = (step.maneuver && step.maneuver.instruction) ? step.maneuver.instruction : "Continue straight"; instr = instr.replace(/^Head /i, '👉 ').replace(/^Turn /i, '↪️ Turn '); if (!instr.includes('👉') && !instr.includes('↪️')) instr = '🔹 ' + instr; const distText = step.distance ? ` (${Math.round(step.distance)} m)` : ''; const stepDiv = document.createElement('div'); stepDiv.className = 'step'; stepDiv.innerHTML = `<span>${idx+1}.</span> <span>${instr}${distText}</span>`; container.appendChild(stepDiv); }); }); container.innerHTML += `<div style="margin-top:12px; border-top:1px solid #55aa77; padding-top:8px;">📏 Total: ${Math.round(totalDist)} m</div>`; }
        async function searchAndNavigate(keyword) { if (!keyword.trim()) { alert("Enter a destination"); return; } const matches = markersArray.filter(m => m.poiData.name.toLowerCase().includes(keyword.toLowerCase()) || m.poiData.type.toLowerCase().includes(keyword.toLowerCase())); if (matches.length === 0) { alert(`No "${keyword}" found.`); return; } let target = matches[0]; if (matches.length > 1) { const list = matches.map((m,i)=>`${i+1}. ${m.poiData.name} (${m.poiData.type})`).join('\n'); const sel = prompt(`Multiple matches:\n${list}\nEnter number (1-${matches.length})`, "1"); if (!sel) return; const idx = parseInt(sel)-1; if (isNaN(idx) || idx<0 || idx>=matches.length) { alert("Invalid"); return; } target = matches[idx]; } let userPos = currentPosition; if (!userPos) { userPos = await updateGPSIndicator(); if (!userPos) { alert("Cannot get your location."); return; } } const tgtLatLng = target.getLatLng(); if (destMarker) map.removeLayer(destMarker); destMarker = L.marker(tgtLatLng, { icon: L.divIcon({ html: '🎯', iconSize: [28,28] }) }).addTo(map).bindPopup(`<b>${target.poiData.name}</b><br>Destination`).openPopup(); try { const route = await fetchRoute(userPos, [tgtLatLng.lat, tgtLatLng.lng]); drawBlueRoute(route.geometry); renderSteps(route); if (currentRoute) map.fitBounds(currentRoute.getBounds()); } catch(err) { alert("Routing error: " + err.message); document.getElementById('stepsContainer').innerHTML = `<div class="step">⚠️ Could not create route</div>`; document.getElementById('directionsPanel').style.display = 'block'; } }
        
        document.getElementById('navGoBtn').addEventListener('click', () => searchAndNavigate(document.getElementById('navSearchInput').value.trim()));
        document.getElementById('navSearchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('navGoBtn').click(); });
        document.getElementById('closeDirBtn').addEventListener('click', () => { document.getElementById('directionsPanel').style.display = 'none'; if (currentRoute) map.removeLayer(currentRoute); if (destMarker) map.removeLayer(destMarker); currentRoute = null; destMarker = null; });
        updateGPSIndicator().then(() => { L.popup().setLatLng([-20.1325,28.6272]).setContent("✨ NAVIGATION READY<br>🛰️ Satellite view (top‑right)<br>🔍 Use left panel to search & navigate").openOn(map); });
    }
</script>
</body>
</html>
